# 自有前端（React）独立部署，与主 docker-compose.yml 解耦。
#
# 服务与端口：
#   new-web         主页面（dist-web-main），宿主机 8080 → 容器 80
#   new-web-tugraph 知识图谱页（dist-web-tugraph 的 resource 资源），宿主机 8081 → 容器 80
#
# 页面代码全部挂载自宿主机目录，升级前端时替换目录内容并 restart 容器即可，不需要重建镜像：
#   ./dist        主页面构建产物（gitignored，由 dist-web-main.7z 解包）
#   ./tugraph     图谱资源目录（gitignored，由 dist-web-tugraph.7z 解包，另加 umi.js 入口副本）
#   ./config.js   主页面运行期配置，覆盖 dist 内同名文件，升级 dist 不会丢
#   ./tugraph-index.html 图谱页 index.html（入口脚本固定为 /resource/umi.js）
#
# 说明：
# - 主页面 /api/ 反代到主 compose 的 api:5050、/minio/public/ 反代到 minio:9000，
#   前端 window.__backend_api_url = location.origin 因此可用；SSE 与上传语义与主站点一致。
# - 图谱页的 /api/ 反代到 TuGraph DB Web 后端（见 nginx-tugraph.conf），页面与后端同源。
# - 通过 external network 接入主 compose 网络，不依赖主 compose 的启动顺序。
#   ❗ 网络名默认取主 compose 的项目名（本项目 = yuxi → yuxi_app-network）。
#     若主 compose 以其它项目名启动，用环境变量 YUXI_APP_NETWORK 覆盖。
# - HTTP 入口即可；需要 HTTPS 时在前面加反向代理，或在 new-web 增加 443 server 块与证书挂载。
services:
  new-web:
    image: nginx:alpine
    container_name: yuxi-new-web
    ports:
      - "${YUXI_NEW_WEB_PORT:-8080}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./config.js:/usr/share/nginx/html/assets/js/config.js:ro
      - ./nginx-main.conf:/etc/nginx/conf.d/default.conf:ro
      # 复用主仓库的 nginx.conf：基础镜像 mime.types 缺少 .mjs 的 JavaScript 映射
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped

  new-web-tugraph:
    image: nginx:alpine
    container_name: yuxi-new-web-tugraph
    ports:
      - "${YUXI_NEW_WEB_TUGRAPH_PORT:-8081}:80"
    volumes:
      # resource 目录以读写挂载：容器内还要把 index.html 作为单文件挂到它下面，
      # 只读挂载会让 Docker 无法创建该挂载点（nginx 本身不写这个目录）。
      - ./tugraph:/usr/share/nginx/graph
      - ./tugraph-index.html:/usr/share/nginx/graph/index.html:ro
      - ./nginx-tugraph.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    name: ${YUXI_APP_NETWORK:-yuxi_app-network}
    external: true

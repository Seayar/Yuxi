# 主页面（dist-web-main）站点配置，由 new-web/docker-compose.yml 的 new-web 服务
# 挂载到 /etc/nginx/conf.d/default.conf，宿主机 8080 → 容器 80。
#
# 前端 config.js 使用 window.__backend_api_url = location.origin，所有请求走同源
# /api/；这里反代到主 compose 的 api:5050，并保留 SSE/上传所需的长超时与关闭缓冲。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单文件上传上限（与主站点语义一致）
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应（/api/agent/runs/{id}/events）
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}

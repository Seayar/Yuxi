# 自有前端（dist.7z 静态构建）站点配置，由 new-web/docker-compose.yml 挂载到
# /etc/nginx/conf.d/default.conf。与 docker/nginx/default.conf 保持同一套反代语义：
# 前端配置 window.__backend_api_url = location.origin，所有请求走同源 /api/。
#
# HTTPS：唯一可信入口为 443（自签证书，SAN 覆盖 192.168.138.10/127.0.0.1/localhost，
# 位于 new-web/certs/，由 compose 挂载到容器 /etc/nginx/certs/，gitignored 不入版本控制）。
# 80 端口只做 301 重定向到 https。

# HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持（/api/agent/runs/{id}/events）
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}

# 知识图谱前端（dist-web-tugraph 的 resource 静态资源）站点配置，由
# new-web/docker-compose.yml 的 new-web-tugraph 服务挂载到
# /etc/nginx/conf.d/default.conf，宿主机 8081 → 容器 80。
#
# 页面本身是 TuGraph DB Web 的前端：静态资源由本容器提供，运行期 /api/ 请求必须
# 反代到同一个 TuGraph DB Web 后端。后端地址变化时只改下面的 proxy_pass 一行。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/graph;
    index index.html;

    client_max_body_size 20M;

    # TuGraph DB Web 后端（提供 /api/*；与页面读取的 resource/graph-config.json
    # 保持同一套 bolt 连接配置）
    location /api/ {
        proxy_pass http://192.168.138.5:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600;
        proxy_connect_timeout 60;
        proxy_send_timeout 600;
    }

    # 构建产物带内容哈希，可长缓存；index.html 与 graph-config.json 不缓存。
    location /resource/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /resource/graph-config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # 哈希路由（#/analysis?...）由 index.html 承载。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
